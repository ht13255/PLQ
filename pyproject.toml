[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plq-sim"
version = "0.1.0"
description = "Transparent photonic logical-qubit and quantum error-correction simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
perceval = ["perceval-quandela>=1.2,<1.3"]
pennylane = ["pennylane>=0.45,<0.46"]
qec = ["stim>=1.15,<2", "pymatching>=2.3,<3"]
reference = ["mpmath>=1.3,<2"]
test = ["pytest>=8,<10"]
all = ["perceval-quandela>=1.2,<1.3", "pennylane>=0.45,<0.46", "stim>=1.15,<2", "pymatching>=2.3,<3", "mpmath>=1.3,<2", "pytest>=8,<10"]

[project.scripts]
plq = "plq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
